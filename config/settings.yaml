# ==============================================================================
# RoboMaster EP Autonomous Grid Navigation System Configuration
# รวมค่าเริ่มต้นและการตั้งค่าทั้งหมดของระบบไว้ที่นี่ สามารถแก้ไขได้ในไฟล์นี้ไฟล์เดียว
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Robot & Connection Settings (การเชื่อมต่อและโหมดการทำงาน)
# ------------------------------------------------------------------------------
robot:
  conn_type: "ap"                # โหมดเชื่อมต่อ: "ap" (Direct Wi-Fi) หรือ "sta" (Router)
  mock_mode: false               # true = จำลองโดยไม่ต้องต่อหุ่นจริง, false = รันบนหุ่นจริง

# ------------------------------------------------------------------------------
# 2. Sensor Pipeline & Calibration - Thread 1 (การประมวลผลเซนเซอร์)
# ------------------------------------------------------------------------------
sensor_pipeline:
  sensor_rate_hz: 20.0           # ความถี่ในการอ่านและกรองค่าเซนเซอร์ (Hz)
  calibration_file: "calibration_output/calibration.json"
  wall_detect_side_mm: 280.0     # ระยะตรวจจับกำแพงด้านข้าง (mm)
  wall_detect_front_mm: 350.0    # ระยะตรวจจับกำแพงด้านหน้า (mm)
  sharp_raw_min: 50.0            # กรองค่า ADC ต่ำสุดของ Sharp (ตัด Outlier)
  sharp_raw_max: 900.0           # กรองค่า ADC สูงสุดของ Sharp
  median_window: 5               # ขนาด Window ของ Median Filter
  ema_alpha: 0.35                # ค่าน้ำหนัก Exponential Moving Average (0.0 - 1.0)

# ------------------------------------------------------------------------------
# 3. Motion & PID Controller - Thread 2 (การเคลื่อนที่และควบคุม PID 8 Cases)
# ------------------------------------------------------------------------------
controller:
  cell_size_m: 0.60              # ขนาดช่อง Grid ของสนาม (เมตร)
  cruising_speed: 0.25           # ความเร็วเดินหน้าปกติ (เมตร/วินาที)
  nominal_side_dist_mm: 140.0    # ระยะห่างเป้าหมายจากหุ่นถึงกำแพงเดี่ยว (mm)
  front_wall_stop_dist_mm: 150.0 # ระยะหยุดเป้าหมายเมื่อมีกำแพงหน้า (mm)
  pause_between_steps_sec: 0.1   # เวลาหยุดนิ่งระหว่างเปลี่ยนช่อง Grid (วินาที)
  
  # PID ปรับตำแหน่งกึ่งกลางซ้าย-ขวา (Lateral Control: vy)
  lateral_pid:
    kp: 0.0018
    ki: 0.0
    kd: 0.0004
    max_output: 0.15             # ความเร็วปรับด้านข้างสูงสุด (m/s)
    deadband: 3.0                # ระยะ Error ที่ยอมรับได้ (mm)

  # PID ควบคุมการล็อกทิศทางมุมหัวรถ (Heading Lock: vz)
  heading_pid:
    kp: 0.80
    ki: 0.0
    kd: 0.10
    max_output: 30.0             # ความเร็วหมุนชดเชยสูงสุด (deg/s)

  # PID ควบคุมระยะหยุดด้านหน้า (Longitudinal Control: vx)
  longitudinal_pid:
    kp: 0.0015
    ki: 0.0
    kd: 0.0002
    max_output: 0.20             # ความเร็วเดินหน้า/ถอยหลังสูงสุด (m/s)

# ------------------------------------------------------------------------------
# 4. Gripper & Robotic Arm - Step 4 (การควบคุมแขนกลและมือจับ)
# ------------------------------------------------------------------------------
gripper:
  extend_cm: 7.0                 # ระยะยื่นแขนกลไปข้างหน้าขณะหยิบของ (cm)
  lift_cm: 10.0                  # ระยะยกแขนกลขึ้นหลังจับของ (cm)
  drop_backup_cm: 30.0           # ระยะถอยหลังของฐานล้อขณะวางของ (cm)
  action_delay_sec: 0.5          # เวลาหน่วงระหว่างแต่ละจังหวะของแขนกล (วินาที)

# ------------------------------------------------------------------------------
# 5. Map & Telemetry (แผนที่และบันทึกข้อมูล)
# ------------------------------------------------------------------------------
system:
  default_plan_file: "data/robot_map_plan.json"
  telemetry_logs_dir: "telemetry_logs"
